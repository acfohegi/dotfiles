# ============================================================
# GENERAL SETTINGS
# ============================================================

# TERM for new panes; tmux-256color enables 256 colors and,
# combined with the RGB feature below, truecolor support
set -g default-terminal "tmux-256color"

# advertise truecolor (RGB) to xterm-256color / alacritty
# terminals; default: off
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"

# OVERRIDE: tmux 3.8+ default = built-in light/dark theme; use terminal palette instead
# (-q: no error on older tmux without this option)
set -sq theme terminal

# delay (ms) for Escape sequence detection; default 500ms,
# 1ms makes vim Esc and arrow keys feel instant
set -sg escape-time 1

# scrollback lines kept per pane; default is 2000
set -g history-limit 100000

# mouse: select/resize panes, scrollback, copy; default off
set -g mouse on

# windows numbered from 1 (vim-like); default is 0
set -g base-index 1

# panes numbered from 1; default is 0
setw -g pane-base-index 1

# copy-pipe bindings handle the system clipboard via tmux-copy.sh
# (pbcopy/xclip/xsel), so OSC52 stays off to avoid double writes.
# OSC52 is a terminal escape sequence that pushes text to the
# system clipboard; it works over ssh but needs terminal support
# (iTerm2, WezTerm, ghostty, ...). tmux enables it via
# set-clipboard; with copy-pipe active both would write the
# clipboard twice (see tmux wiki "Clipboard")
set -s set-clipboard off

# ============================================================
# PREFIX
# ============================================================

# OVERRIDE: default prefix is C-b; C-a becomes the main prefix
set -g prefix C-a
# OVERRIDE: default prefix2 is unset; C-b kept as secondary
# prefix for compatibility
set -g prefix2 C-b
bind C-a send-prefix
# OVERRIDE: default C-b send-prefix; same purpose, adapted to prefix2
bind C-b send-prefix -2

# ============================================================
# WINDOWS
# ============================================================

# OVERRIDE: default t = clock-mode; vim-style "new tab"
bind t new-window -c "#{pane_current_path}"
# OVERRIDE: default c = new-window; clock moved here
bind c clock-mode
# OVERRIDE: default , = command-prompt -I "#W" { rename-window "%%" } -
# prompt prefilled with current name; start with an empty prompt instead
bind-key , command-prompt "rename-window '%%'"
# addition: last-window moved to b (l is taken over by pane navigation
# below)
bind-key b last-window
# addition: Tab / Shift-Tab cycle windows; stock n/p also kept
bind-key -r Tab next-window
bind-key -r BTab previous-window
# addition: vim-style "go" prefix for window navigation (gt / gT)
bind-key g switch-client -T go
bind-key -T go t next-window
bind-key -T go T previous-window

# ============================================================
# PANES
# ============================================================

# default " = split-window (top/bottom); only the current
# directory is added, so new panes start in the same path
bind '"' split-window -c "#{pane_current_path}"
# default % = split-window -h (left/right); only the current
# directory is added, so new panes start in the same path
bind % split-window -h -c "#{pane_current_path}"
# addition: vim-style pane navigation (repeatable)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
# OVERRIDE: default l = last-window; vim-style pane navigation
bind-key -r l select-pane -R
# OVERRIDE: default x = confirm-before -p "kill-pane #P? (y/n)";
# confirmation dropped on purpose
bind x kill-pane

# ============================================================
# STATUS BAR
# ============================================================

# addition: toggle status bar visibility
bind S set-option -g status

# ============================================================
# COPY MODE & PASTE
# ============================================================

# vi-style keys in copy mode; default emacs
set -g mode-keys vi
# addition: stock copy-mode is [; v is a vim-style shortcut
bind v copy-mode
# addition: enter copy mode scrolled half page up
bind C-u copy-mode \; send-keys -X halfpage-up
# addition: paste top buffer (stock p = paste-buffer, ] = paste-buffer -p)
bind P paste-buffer
# OVERRIDE: default v (copy-mode-vi) = rectangle-toggle;
# vim visual-mode style selection
bind -T copy-mode-vi v send-keys -X begin-selection
# OVERRIDE: default C-v = rectangle-toggle; selection + rectangle
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
# addition: no y in stock; deliberately copy-pipe WITHOUT and-cancel
# to stay in copy mode
bind -T copy-mode-vi y send-keys -X copy-pipe "~/.config/tmux/tmux-copy.sh"
bind -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe "~/.config/tmux/tmux-copy.sh"
# OVERRIDE: default MouseDragEnd1Pane = copy-pipe-and-cancel (tmux buffer
# only); mouse selection now goes straight to the system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.config/tmux/tmux-copy.sh"

# ============================================================
# PLUGINS
# ============================================================

if-shell 'test ! -d "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm"' {
    run 'git clone https://github.com/tmux-plugins/tpm "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm"'
    display-message 'TPM repo cloned. Press prefix+I to install plugins.'
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'

run '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"'

