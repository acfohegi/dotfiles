[general]
import = [
    "~/.config/alacritty/current/theme.toml",
    "~/.config/alacritty/current/font_size.toml"
]

[mouse]
hide_when_typing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Light"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Medium Italic"

